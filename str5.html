<body>

 <header class="safe-header">
    <h1 class="safe-title">Сейф открыт</h1>

  <!-- Стопка полароидов -->

  <!-- Индикатор: сколько просмотрено -->

  <!-- Кнопка «А вот ещё» -->
  <button class="more-btn" type="button" id="moreBtn">Ещё чуть-чуть фоток↓</button>

  <!-- Сетка остальных фото (скрыта до клика) -->
  <section class="photo-grid" id="photoGrid" hidden>
    <!-- Карточки добавляются из JS -->
  </section>
